name: test
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [dev] pulls the adapters and telemetry sinks too: the adapter tests
      # import fastapi/flask at module scope, and the integration tests exercise
      # the optional sinks. A venv without them fails at collection with
      # ModuleNotFoundError, which reads as broken code rather than a missing
      # environment.
      - run: pip install -e '.[dev]'
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The component is package data; a wheel that drops it serves a 404 for
      # /simsys-tokens.js and every adopter's page breaks silently.
      - run: unzip -l dist/*.whl | grep -q simsys_tokens/static/simsys-tokens.js
      - name: install the built wheel and import it
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv /tmp/whl
          /tmp/whl/bin/pip install "${WHEEL}[fastapi]"
          /tmp/whl/bin/python -c "import simsys_tokens; from simsys_tokens.fastapi import install_tokens; print(simsys_tokens.__version__)"
